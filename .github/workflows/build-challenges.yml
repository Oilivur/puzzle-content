name: Build content and deploy Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: puzzle-content-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate challenge data
        run: python scripts/build_challenges.py

      - name: Commit generated files if changed
        run: |
          git config user.name "Puzzle Parlour Bot"
          git config user.email "actions@github.com"

          git add challenges/manifest.json
          git add challenges/daily/catalog.json
          git add challenges/weekly/catalog.json
          git add challenges/monthly/catalog.json

          if git diff --cached --quiet; then
            echo "Challenge files are already current"
          else
            git commit -m "Update challenge content"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
